<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 Not Found</title>
  {% include "favicon.html" %}
  <link rel="stylesheet" href="{{ get_url(path='writing.css', cachebust=true) }}">
</head>
<body>
  <main class="empty-writing not-found" aria-label="Page not found">
    {% set empty_image = resize_image(path="static/images/empty.png", width=320, op="fit_width", format="webp", quality=82) %}
    <img src="{{ empty_image.url }}" width="160" height="160" alt="">
    <p>Ooops</p>
  </main>
</body>
</html>
